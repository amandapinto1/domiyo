# Local development and test database only. Never use these credentials elsewhere.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: domiyo
      POSTGRES_PASSWORD: 2735b82c1004ac4717c073fec16bb0f6
      POSTGRES_DB: domiyo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domiyo -d domiyo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
